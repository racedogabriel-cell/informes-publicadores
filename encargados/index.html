<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#155e4b" />
    <meta name="description" content="Portal de encargados para completar informes del grupo." />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/encargados.css?v=39" />
    <title>Portal Encargados</title>
  </head>
  <body class="encargados-body">
    <div class="encargados-shell">
      <header class="encargados-topbar">
        <div class="encargados-brand">
          <div>
            <h1>Carga de informes</h1>
          </div>
        </div>

        <div class="encargados-toolbar" aria-label="Contexto y estado">
          <div class="encargados-meta">
            <span class="encargados-meta-chip" id="context-grupo-chip">
              <span class="encargados-meta-label">Grupo</span>
              <strong id="context-grupo">—</strong>
            </span>
            <span class="encargados-meta-chip">
              <span class="encargados-meta-label">Período</span>
              <strong id="context-mes">—</strong>
            </span>
          </div>
          <div id="save-indicator" class="save-indicator" data-state="saved" role="status" aria-live="polite">
            <span class="save-indicator-dot" aria-hidden="true"></span>
            <span class="save-indicator-text">Guardado</span>
            <button type="button" class="save-indicator-retry" id="save-indicator-retry" hidden>Reintentar</button>
          </div>
        </div>
      </header>

      <main class="encargados-main" id="encargados-app"></main>
    </div>
    <script type="module" src="./js/app.js?v=27"></script>
  </body>
</html>
